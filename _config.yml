# ============================================================
# Site settings
# ============================================================
title: ziyaochen's Blog
SEOTitle: ziyaochen's Blog
header-img: img/2017-bg.jpg
email: ziychen@zju.edu.cn
description: "记录学习过程中的一些心得与总结"
keyword: "NLP, 自然语言处理, 对话系统, 机器学习, 深度学习"
lang: zh-CN
timezone: Asia/Shanghai

# 站点地址。
# 若仓库名为 <用户名>.github.io  ->  url = https://<用户名>.github.io ，baseurl 留空
# 若为普通项目仓库             ->  url = https://<用户名>.github.io ，baseurl = /<仓库名>
url: "https://zychen-real.github.io"
baseurl: ""

# ============================================================
# SNS settings
# ============================================================
# weibo_username:
# zhihu_username:
github_username: zychen-real

# ============================================================
# Build settings
# ============================================================
highlighter: rouge
permalink: /:year/:month/:day/:title/
paginate: 10
paginate_path: "/page:num/"

plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-seo-tag

exclude:
  - less
  - node_modules
  - Gruntfile.js
  - package.json
  - package-lock.json
  - Gemfile
  - Gemfile.lock
  - README.md
  - README.zh.md
  - LICENSE
  - vendor
  - .github

# ============================================================
# Collections
# ============================================================
# 每年一个合集。Jekyll 不允许以数字开头作为 collection 名（变量
# 命名限制），所以内部 key 用 y<年>，对外的 URL/导航都展示年份。
# 新增年份：1) 在下面加 collection；2) 复制 y2018 的 defaults；
#          3) 复制 2018.html 出 <年>.html；4) nav.html 加链接；
#          5) 把 index.html 里的 site.y<最新年份> 换成新集合。
collections:
  y2018:
    output: true
    permalink: /2018/:path/
  y2026:
    output: true
    permalink: /2026/:path/

# 给所有文章统一补默认值，避免每篇都写重复字段
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      author: ziyaochen
      header-img: img/2017-bg.jpg
      catalog: true
      mathjax: true
  - scope:
      path: ""
      type: y2018
    values:
      layout: post
      author: ziyaochen
      header-img: img/2017-bg.jpg
      catalog: true
      mathjax: true
  - scope:
      path: ""
      type: y2026
    values:
      layout: post
      author: ziyaochen
      header-img: img/2017-bg.jpg
      catalog: true
      mathjax: true

anchorjs: true

# ============================================================
# Markdown settings
# ============================================================
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  hard_wrap: false

# ============================================================
# Baidu Share
# ============================================================
bd_share: false

# ============================================================
# Analytics settings
# ============================================================
# ba_track_id:

# ============================================================
# Sidebar settings
# ============================================================
sidebar: true
sidebar-about-description: "Keep Thinking."
sidebar-avatar: /img/avar.jpg

# ============================================================
# Featured Tags
# ============================================================
featured-tags: true
featured-condition-size: 1

